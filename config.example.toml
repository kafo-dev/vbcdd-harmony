# The daemon's configuration. Every profile has its own directory beside this
# file, below `profiles/`.

display_name = "vbcdd-harmony"

# The OpenAI-compatible endpoint every profile's agent calls.
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key = "sk-..."

# A command that prints the key. It runs through `$SHELL -c` on every start and
# wins over `api_key`, which suits a secret manager.
api_key_command = "op read op://Private/OpenAI/credential"

# How much the model may spend on reasoning before it answers, as the endpoint
# defines it. An empty value leaves the choice to the endpoint.
reasoning_effort = "low"

# Bounds on one request.
max_turns = 20

# Interprets every schedule.
timezone = "UTC"

# The ntfy server, and the token that reaches its topics.
ntfy_url = "https://ntfy.example.com"
ntfy_token = "REPLACE_WITH_THE_NTFY_ACCESS_TOKEN"

# Extra request headers.
[headers]
"X-Api-Key" = "..."

# Every profile is mapped, and every mapped profile must be installed. The
# daemon refuses to start when the two do not match.
[topics]
"vbcdd-general" = "general"
"vbcdd-harmony" = "scheduler"
